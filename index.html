<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindYpet — Pet Found!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f8f9;
            margin: 0;
        }
        .card {
            background: white;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
            max-width: 400px;
            margin: 20px auto;
        }
        .logo {
            width: 140px;
            height: auto;
            margin-bottom: 15px;
        }
        h1 {
            color: #0098a6;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #444;
            font-size: 15px;
            line-height: 1.4;
        }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            background-color: #ff7a18;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(255, 122, 24, 0.3);
        }
        #status {
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- FindYpet Logo -->
        <img src="logo.png" alt="FindYpet Logo" class="logo">

        <h1>🐾 I'm Sammy and I'm lost!</h1>
        <p>Please help me get back home. Tap the button below to contact my owner.</p>

        <!-- Call Button -->
        <a href="tel:+972526279522" class="btn">📞 Call Owner</a>

        <div id="status">Requesting location to send to the owner...</div>
    </div>

    <script>
        // 1. Get Pet ID from URL (e.g., ?id=101)
        const urlParams = new URLSearchParams(window.location.search);
        const petId = urlParams.get('id') || '101'; // '101' default for testing

        // =========================================================================
        // 2. PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
        // =========================================================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNXGQOHVvsgqs8pdchbjncEq0VVaR81HQMx7Fj4IOSOVqAMkk4R6ktfKhkejDXKjOf/exec
';
        // =========================================================================

        function sendLocation() {
            const statusDiv = document.getElementById("status");

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;

                        // Send coordinates to Google Apps Script backend
                        fetch(SCRIPT_URL, {
                            method: "POST",
                            mode: "no-cors", // Required to bypass CORS rules in Google Apps Script
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                pet_id: petId,
                                latitude: lat,
                                longitude: lon
                            })
                        });

                        statusDiv.innerText = "📍 Your location has been sent to the owner!";
                        statusDiv.style.color = "#28a745";
                    },
                    (error) => {
                        statusDiv.innerText = "Location not sent (access denied).";
                        statusDiv.style.color = "#dc3545";
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                statusDiv.innerText = "Geolocation is not supported by your browser.";
            }
        }

        // Trigger location request on page load
        window.onload = sendLocation;
    
    </script>

</body>
</html>
